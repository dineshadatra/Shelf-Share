project_id = "shelfshare"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false

[auth.sessions]
timebox = "30d"
inactivity_timeout = "24h"

[auth.rate_limit]
sms_sent = 15
sign_in_sign_ups = 20
token_verifications = 10
token_refresh = 150

[auth.sms]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 300
max_frequency = "60s"

[functions.verification-admin]
verify_jwt = true

# Configure the SMS provider in Supabase Dashboard. Credentials belong in server-side
# secrets only; never in VITE_* browser variables.

[functions.marketplace-api]
verify_jwt = false # JWT is checked in the handler; provider webhooks have no user JWT.

[functions.marketplace-outbox]
verify_jwt = false # Protected by a dedicated worker secret; never expose to browsers.
