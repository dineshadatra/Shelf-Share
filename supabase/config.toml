project_id = "shelfshare"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.rate_limit]
sms_sent = 30
sign_in_sign_ups = 30
token_verifications = 30
token_refresh = 150

[auth.sms]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 300
max_frequency = "60s"

# Configure one SMS provider in Supabase Dashboard for hosted projects.
# Keep provider credentials in Supabase secrets / environment variables only.
